name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@ci
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@ci

  # Validate the pnpm workspace + npm packages.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile=false

      - name: TypeScript type check
        run: npx tsc --noEmit --project npm/jixomd/tsconfig.json

      - name: Build TypeScript package
        run: cd npm/jixomd && pnpm run build

      - name: Verify all packages pack
        run: pnpm -r pack --dry-run

      - name: Build host binary for platform test
        run: |
          SLUG=$(node -e "const{detect}=require('./npm/jixomd/dist/platform.js');const d=detect();console.log(d.slug)")
          go build -o "npm/jixomd-${SLUG}/jixomd" ./cmd/jixomd

      - name: Platform resolution test
        run: node npm/test/resolve-platform.test.js

      - name: Packed resolve test
        run: node npm/test/resolve-packed.test.js
