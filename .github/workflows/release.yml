name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v)'
        required: true

permissions:
  contents: write
  id-token: write   # npm trusted publishing (provenance)

jobs:
  # ── Cross-compile 6 platforms, each into its npm platform package dir ──
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            slug: darwin-arm64
            bin: jixomd
          - goos: darwin
            goarch: amd64
            slug: darwin-x64
            bin: jixomd
          - goos: linux
            goarch: arm64
            slug: linux-arm64
            bin: jixomd
          - goos: linux
            goarch: amd64
            slug: linux-x64
            bin: jixomd
          - goos: windows
            goarch: arm64
            slug: win-arm64
            bin: jixomd.exe
          - goos: windows
            goarch: amd64
            slug: win-x64
            bin: jixomd.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary into platform package dir
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          OUT="npm/jixomd-${{ matrix.slug }}/${{ matrix.bin }}"
          go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/jixomd
          ls -lh "$OUT"

      - name: Smoke-test the binary (native arch only)
        if: matrix.slug == 'linux-x64'
        run: |
          chmod +x npm/jixomd-linux-x64/jixomd
          npm/jixomd-linux-x64/jixomd --help > /dev/null && echo "smoke OK"

      - name: Upload platform package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.slug }}
          path: npm/jixomd-${{ matrix.slug }}/

  # ── Create the GitHub Release (direct download fallback) ──
  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries for the release
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for slug in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win-arm64 win-x64; do
            dir="artifacts/pkg-${slug}"
            if [ -f "${dir}/jixomd.exe" ]; then
              (cd "$dir" && zip -q "../../jixomd_${VERSION}_${slug}.zip" jixomd.exe)
            elif [ -f "${dir}/jixomd" ]; then
              (cd "$dir" && tar -czf "../../jixomd_${VERSION}_${slug}.tar.gz" jixomd)
            fi
          done
          ls -lh jixomd_${VERSION}_*

      - name: Create GitHub Release with binary assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: jixomd_*

  # ── Publish all 7 npm packages via pnpm workspace ──
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release   # trusted publishing environment
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Restore the 6 built binaries into their platform package dirs.
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place binaries into platform packages
        shell: bash
        run: |
          for slug in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win-arm64 win-x64; do
            src="artifacts/pkg-${slug}"
            dest="npm/jixomd-${slug}"
            if [ -f "${src}/jixomd.exe" ]; then
              cp "${src}/jixomd.exe" "${dest}/jixomd.exe"
            elif [ -f "${src}/jixomd" ]; then
              cp "${src}/jixomd" "${dest}/jixomd"
              chmod +x "${dest}/jixomd"
            fi
          done

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set all workspace package versions
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: pnpm install (link workspace)
        run: pnpm install --frozen-lockfile=false

      - name: Publish all packages (workspace:* auto-rewritten to version)
        run: pnpm publish -r --access public --provenance --no-git-checks
