name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v)'
        required: true

permissions:
  contents: write

jobs:
  # ── Cross-compile for 6 platforms and upload release assets ──
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BINARY_NAME=jixomd
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME=jixomd.exe
          fi
          go build -trimpath -ldflags="-s -w" -o "dist/$BINARY_NAME" ./cmd/jixomd

      - name: Package (tar.gz for unix, zip for windows)
        shell: bash
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          SLUG="${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "../jixomd_${VERSION}_${SLUG}.zip" jixomd.exe
          else
            tar -czf "../jixomd_${VERSION}_${SLUG}.tar.gz" jixomd
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jixomd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: jixomd_*.tar.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jixomd_*.tar.gz
            jixomd_*.zip
          fail_on_unmatched_files: false

  # ── Publish the npm wrapper package ──
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm package
        working-directory: npm/jixomd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
